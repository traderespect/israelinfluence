<!DOCTYPE html>
<html lang="ru" dir="ltr" class="disp-ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IIA — Ассоциация русскоязычных блогеров</title>
<meta name="description" data-i18n-content="meta_desc" content="Первая в Израиле инфраструктура для адаптации русскоязычных блогеров, предпринимателей и их семей.">
<meta property="og:title" content="IIA — Ассоциация русскоязычных блогеров">
<meta property="og:type" content="website">
<meta property="og:url" content="https://influenceisrael.com/">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Oswald:wght@500;600;700&family=Heebo:wght@400;600;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414;
  --bone:#F7F4EE;
  --accent:#7A1F1C;
  --radius:0px;
  --display:'Oswald','Arial Narrow',sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --hair:rgba(20,20,20,0.15);
}
html.disp-en{--display:'Six Caps','Arial Narrow',sans-serif}
html.disp-ru{--display:'Oswald','Arial Narrow',sans-serif}
html.disp-he{--display:'Heebo',Arial,sans-serif;--serif:'Frank Ruhl Libre',Georgia,serif;--body:'Heebo',Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body)}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
::selection{background:var(--accent);color:var(--bone)}

.page{position:relative;max-width:1280px;margin:0 auto;border-inline-start:1px solid var(--hair);border-inline-end:1px solid var(--hair);overflow:clip}
.thread{position:absolute;inset-inline-start:22.5%;top:0;width:120px;height:100%;z-index:0;pointer-events:none;overflow:visible}
[dir=rtl] .thread{transform:scaleX(-1)}
.thread path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}

.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;box-sizing:border-box;border-radius:var(--radius);letter-spacing:0.06em;font-size:13px}
.btn-ink{background:var(--ink);color:#fff;padding:15px 26px}
.btn-ink:hover{background:var(--accent);color:#fff}
.btn-line{border:1px solid var(--ink);padding:15px 26px}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.diamond{display:inline-block;width:5px;height:5px;background:var(--accent);transform:rotate(45deg);vertical-align:middle;margin-inline-end:7px}

.ph{position:relative;background:
  repeating-linear-gradient(-45deg, rgba(20,20,20,0.05) 0 1px, transparent 1px 9px),
  #ECE7DC;display:flex;align-items:center;justify-content:center}
.ph::after{content:attr(data-label);font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:rgba(20,20,20,0.4)}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 40px;height:76px;border-bottom:1px solid var(--ink);position:relative;z-index:2;background:var(--bone);gap:16px}
.logo{display:flex;align-items:center;gap:16px;flex:none}
.logo-mark{position:relative;line-height:1}
.logo-mark .iia{font-family:'Six Caps','Arial Narrow',sans-serif;font-size:34px;letter-spacing:0.04em}
.logo-mark svg{position:absolute;inset-inline-start:-3px;top:22px;width:44px;height:8px;overflow:visible}
.logo-mark svg path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
.logo-name{font-size:12px;letter-spacing:0.04em;line-height:1.4;color:rgba(20,20,20,0.6);border-inline-start:1px solid rgba(20,20,20,0.2);padding-inline-start:16px}
.hdr nav{display:flex;gap:28px;font-size:14px;letter-spacing:0.02em}
.hdr-cta{display:flex;gap:14px;align-items:center;flex:none}
.lang{font-family:var(--mono);font-size:11px;white-space:nowrap}
.lang a{cursor:pointer;color:rgba(20,20,20,0.4)}
.lang a.on{color:var(--ink);text-decoration:underline}
.btn-help{color:var(--accent);border:1px solid var(--accent);padding:10px 16px;font-size:12px;letter-spacing:0.08em}
.btn-help:hover{background:var(--accent);color:#fff}
.hdr .btn-member{padding:10px 20px;font-size:12px;letter-spacing:0.08em}
.burger{display:none;border:1px solid var(--ink);min-width:44px;min-height:44px;align-items:center;justify-content:center;background:none;font-size:16px;cursor:pointer;color:var(--ink)}
.m-menu{display:none}

.hero{display:grid;grid-template-columns:1fr 380px;border-bottom:1px solid var(--ink)}
.hero-main{padding:72px 48px 64px 40px;position:relative;z-index:2}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--accent);margin-bottom:24px}
h1{font-family:var(--display);font-size:104px;line-height:0.95;text-transform:uppercase;font-weight:600;margin:0}
html.disp-he h1{font-weight:800;line-height:1.02}
.hero-main p{margin:40px 0 0;font-size:18px;line-height:1.75;max-width:56ch}
.hero-cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.hero-cta .btn{padding:16px 30px;font-size:14px}
.hero-side{border-inline-start:1px solid var(--ink);display:flex;flex-direction:column;position:relative;z-index:2;background:var(--bone)}
.desk-note{padding:32px 32px 30px;border-bottom:1px solid var(--hair)}
.side-label{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:rgba(20,20,20,0.5)}
.desk-note h3{font-family:var(--serif);font-size:24px;line-height:1.25;margin:14px 0 0;font-weight:500}
.desk-note a{display:inline-block;margin-top:18px;font-size:13px;border-bottom:1px solid var(--accent)}
.crisis-note{padding:28px 32px;border-bottom:1px solid var(--hair)}
.crisis-note h3{font-family:var(--serif);font-size:19px;line-height:1.35;margin:12px 0 0;font-weight:500}
.quote{padding:28px 32px;flex:1;display:flex;align-items:flex-end}
.quote p{margin:0;font-style:italic;font-size:14px;line-height:1.65;color:rgba(20,20,20,0.72)}

.band{border-bottom:1px solid var(--ink)}
.band .ph{height:320px;filter:grayscale(1) contrast(1.05)}
.band-cap{display:flex;justify-content:space-between;align-items:baseline;padding:12px 40px;border-top:1px solid var(--hair)}
.pl-num{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:rgba(20,20,20,0.45)}
.pl-cap{font-style:italic;font-size:13px;letter-spacing:0.02em;color:rgba(20,20,20,0.65)}

.need{padding:56px 40px 0;border-bottom:1px solid var(--ink)}
.need-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.need-head h2{font-family:var(--serif);font-size:52px;line-height:1.04;letter-spacing:-0.015em;font-weight:500;margin:0 0 36px}
.need-head .mono{font-size:11px;letter-spacing:0.14em;color:rgba(20,20,20,0.5)}
.need-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);margin:0 -40px}
.need-grid a{padding:36px 40px;display:flex;flex-direction:column;gap:12px;border-inline-end:1px solid var(--hair)}
.need-grid a:nth-child(3n){border-inline-end:none}
.need-grid a:nth-child(n+4){border-top:1px solid var(--hair)}
.need-grid a:hover{background:var(--ink);color:#fff}
.need-num{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;color:var(--accent)}
.need-title{font-family:var(--serif);font-size:27px;line-height:1.18;letter-spacing:-0.01em;font-weight:500}
.need-desc{font-size:14px;line-height:1.6;opacity:0.65}
.need-list{display:none}

.tiers{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--ink)}
.tier{padding:40px;border-inline-end:1px solid var(--hair)}
.tier:last-child{border-inline-end:none}
.tier-label{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;color:var(--accent);margin-bottom:18px}
.tier-price{font-family:var(--serif);font-size:32px;line-height:1.1;font-weight:500}
.tier p{margin:14px 0 0;font-size:14px;line-height:1.65;color:rgba(20,20,20,0.7)}
.tier a{display:inline-block;margin-top:20px;font-size:13px;border-bottom:1px solid var(--ink)}
.tier-pro{background:var(--ink);color:#fff}
.tier-pro p{color:rgba(255,255,255,0.7)}
.tier-pro a{color:#fff;border-bottom-color:#fff}
.tiers-mobile{display:none}

.events{border-bottom:1px solid var(--ink)}
.events-head{display:flex;justify-content:space-between;align-items:baseline;padding:44px 40px 28px;gap:16px}
.events-head h2{font-family:var(--serif);font-size:38px;line-height:1.06;letter-spacing:-0.015em;font-weight:500;margin:0}
.events-head a{font-size:13px;letter-spacing:0.04em;border-bottom:1px solid var(--ink)}
.events-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
.ev{border-inline-end:1px solid var(--hair);display:flex;flex-direction:column}
.ev:last-child{border-inline-end:none}
.ev .ph{height:170px;border-bottom:1px solid var(--hair);filter:grayscale(1) contrast(1.05)}
.ev-body{padding:24px 32px 28px;display:flex;flex-direction:column;gap:12px;flex:1}
.ev-date{display:flex;align-items:baseline;gap:12px}
.ev-day{font-family:var(--serif);font-size:44px;line-height:0.98;font-weight:500}
.ev-meta{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:rgba(20,20,20,0.55)}
.ev-title{font-size:16px;line-height:1.45}
.ev .btn{margin-top:auto;width:fit-content;padding:12px 20px;font-size:12px}
.events-list{display:none}

.news{display:grid;grid-template-columns:1fr 420px;border-bottom:1px solid var(--ink)}
.news-main{padding:44px 40px}
.news-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:16px}
.news-head .mono{font-size:11px;letter-spacing:0.14em}
.news-head a{font-size:13px}
.news-row{padding:16px 0;border-top:1px solid var(--hair);display:flex;gap:24px;align-items:baseline}
.news-date{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:0.08em;white-space:nowrap}
.news-row span:last-child{font-size:16px;line-height:1.55}
.news-side{border-inline-start:1px solid var(--ink);display:flex;flex-direction:column}
.news-side .ph{height:190px;filter:grayscale(1) contrast(1.05)}
.news-side-cap{display:flex;justify-content:space-between;align-items:baseline;padding:9px 36px;border-bottom:1px solid var(--hair)}
.news-side-cap .pl-cap{font-size:12px}
.join{padding:32px 36px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.join .mono{font-size:11px;letter-spacing:0.14em;color:rgba(20,20,20,0.55)}
.join-big{font-family:var(--serif);font-size:32px;line-height:1.1;font-weight:500}
.join .btn{width:fit-content;padding:14px 24px}

.crisis{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 40px;background:var(--accent);color:#fff}
.crisis span{font-size:16px;letter-spacing:0.01em}
.crisis a{color:var(--accent);background:#fff;padding:12px 24px;font-size:13px;letter-spacing:0.06em;white-space:nowrap;border-radius:var(--radius);min-height:44px;display:inline-flex;align-items:center}
.crisis a:hover{background:var(--ink);color:#fff}

footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 40px;font-family:var(--mono);font-size:11px;letter-spacing:0.1em}
footer div{display:flex;gap:22px}

@media (max-width:900px){
  .hdr nav,.hdr .btn-member{display:none}
  .burger{display:inline-flex}
  .m-menu.open{display:flex;position:fixed;inset:0;z-index:50;background:var(--bone);flex-direction:column;padding:24px 20px;gap:6px;overflow:auto}
  .m-menu .m-close{align-self:flex-end;border:1px solid var(--ink);min-width:44px;min-height:44px;background:none;font-size:16px;cursor:pointer;color:var(--ink)}
  .m-menu a{font-family:var(--serif);font-size:26px;line-height:1.2;padding:12px 0;border-bottom:1px solid var(--hair)}
  .m-menu .m-cta{display:flex;flex-direction:column;gap:10px;margin-top:24px}
  .m-menu .m-cta a{font-family:inherit;font-size:13px;border-bottom:none;padding:0}
  .m-menu .lang{display:block;margin-top:18px;font-size:13px}
}
@media (max-width:720px){
  .page{border-inline-start:none;border-inline-end:none}
  .thread{inset-inline-start:44px;width:40px}
  .thread path{stroke-width:1.6}
  .hdr{padding:12px 20px;height:auto}
  .logo{gap:10px}
  .logo-mark .iia{font-size:28px}
  .logo-mark svg{inset-inline-start:-2px;top:18px;width:38px;height:7px}
  .logo-name{font-size:9px;padding-inline-start:10px}
  .btn-help{padding:8px 12px;font-family:var(--mono);font-size:10px}

  .hero{grid-template-columns:1fr}
  .hero-main{padding:40px 20px 36px}
  .kicker{font-size:10px;letter-spacing:0.14em;margin-bottom:16px}
  h1{font-size:52px}
  .hero-main p{margin:26px 0 0;font-size:15px;line-height:1.7}
  .hero-cta{flex-direction:column;gap:10px;margin-top:26px}
  .hero-cta .btn{padding:15px 22px;font-size:13px}
  .hero-side{border-inline-start:none;border-top:1px solid var(--ink)}
  .desk-note{padding:24px 20px;border-bottom:none}
  .desk-note h3{font-size:21px;line-height:1.28;margin-top:12px}
  .crisis-note,.quote{display:none}

  .band .ph{height:180px}
  .band-cap{padding:10px 20px}

  .need{padding:30px 20px 0}
  .need-head h2{font-size:36px;line-height:1.05;margin-bottom:22px}
  .need-head .mono{display:none}
  .need-grid{display:none}
  .need-list{display:flex;flex-direction:column;margin:0 -20px}
  .need-list a{padding:16px 20px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:16px}
  .need-list .need-num{display:block;font-size:9px;letter-spacing:0.1em;margin-bottom:5px}
  .need-list .need-title{font-size:20px;line-height:1.2}
  .need-list .arr{font-size:16px}
  [dir=rtl] .need-list .arr{display:inline-block;transform:scaleX(-1)}

  .tiers{display:none}
  .tiers-mobile{display:block;padding:28px 20px;border-bottom:1px solid var(--ink);background:var(--ink);color:#fff}
  .tiers-mobile .tier-label{margin-bottom:12px;font-size:10px;letter-spacing:0.12em}
  .tiers-mobile p{margin:0;font-size:14px;line-height:1.65;color:rgba(255,255,255,0.75)}
  .tiers-mobile a{display:inline-flex;align-items:center;margin-top:16px;background:#fff;color:var(--ink);padding:13px 22px;font-size:13px;letter-spacing:0.06em;min-height:44px}
  .tiers-mobile a:hover{background:var(--accent);color:#fff}

  .events-head{padding:26px 20px 16px}
  .events-head h2{font-size:26px}
  .events-head a{font-size:12px}
  .events-grid{display:none}
  .events-list{display:block}
  .ev-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--hair)}
  .ev-row-l{display:flex;align-items:center;gap:14px}
  .ev-row .ph{width:80px;height:80px;flex:none;border:1px solid var(--hair);filter:grayscale(1) contrast(1.05)}
  .ev-row .ph::after{content:''}
  .ev-row .ev-day{font-size:30px}
  .ev-row .ev-meta{font-size:9px;letter-spacing:0.08em}
  .ev-row .ev-title{font-size:14px;line-height:1.4;margin-top:4px}
  .ev-row .btn{padding:12px 14px;font-size:11px;white-space:nowrap}

  .news{grid-template-columns:1fr}
  .news-main{padding:28px 20px}
  .news-head{margin-bottom:14px}
  .news-head .mono{font-size:10px;letter-spacing:0.12em}
  .news-row{padding:12px 0;gap:14px}
  .news-row span:last-child{font-size:15px}
  .news-side{display:none}

  .crisis{flex-direction:column;align-items:flex-start;padding:20px;gap:12px}
  .crisis span{font-size:14px;line-height:1.6}
  .crisis a{padding:13px 20px;font-size:12px}

  footer{padding:16px 20px;font-size:10px;letter-spacing:0.1em;flex-wrap:wrap;gap:10px}
  footer .f-links{gap:14px}
  footer .f-social,footer .f-extra{display:none}
}
</style>
</head>
<body>
<div class="page">
  <svg class="thread" viewBox="0 0 120 1000" preserveAspectRatio="none" aria-hidden="true">
    <path d="M60 0 C 30 90, 96 170, 52 260 S 8 380, 66 470 C 104 545, 22 610, 44 700 S 92 800, 58 880 L 62 1000" vector-effect="non-scaling-stroke"/>
  </svg>

  <header class="hdr">
    <a class="logo" href="/" aria-label="IIA">
      <span class="logo-mark"><span class="iia">IIA</span><svg viewBox="0 0 44 8" aria-hidden="true"><path d="M0 6 C 12 5, 24 2.5, 35 1.5 L 44 0"/></svg></span>
      <span class="logo-name" data-i18n="logo_sub"></span>
    </a>
    <nav aria-label="Main">
      <a href="#about" data-i18n="nav_about"></a><a href="#mission" data-i18n="nav_mission"></a><a href="#membership" data-i18n="nav_membership"></a><a href="#events" data-i18n="nav_events"></a><a href="#mission" data-i18n="nav_media"></a><a href="#partners" data-i18n="nav_partners"></a>
    </nav>
    <div class="hdr-cta">
      <span class="lang"><a data-lang="ru">RU</a> · <a data-lang="he">HE</a> · <a data-lang="en">EN</a></span>
      <a href="#partners" class="btn btn-help" data-i18n="btn_partners"></a>
      <a href="#membership" class="btn btn-ink btn-member" data-i18n="btn_join"></a>
      <button class="burger" aria-label="Menu" onclick="document.querySelector('.m-menu').classList.add('open')">☰</button>
    </div>
  </header>

  <div class="m-menu" role="dialog" aria-label="Menu">
    <button class="m-close" aria-label="Close" onclick="document.querySelector('.m-menu').classList.remove('open')">✕</button>
    <a href="#about" data-i18n="nav_about" onclick="closeMenu()"></a>
    <a href="#mission" data-i18n="nav_mission" onclick="closeMenu()"></a>
    <a href="#membership" data-i18n="nav_membership" onclick="closeMenu()"></a>
    <a href="#events" data-i18n="nav_events" onclick="closeMenu()"></a>
    <a href="#partners" data-i18n="nav_partners" onclick="closeMenu()"></a>
    <div class="m-cta">
      <a href="#membership" class="btn btn-ink" data-i18n="btn_join" onclick="closeMenu()"></a>
      <a href="#partners" class="btn btn-line" data-i18n="btn_partners" onclick="closeMenu()"></a>
    </div>
    <span class="lang"><a data-lang="ru">RU</a> · <a data-lang="he">HE</a> · <a data-lang="en">EN</a></span>
  </div>

  <section class="hero" id="about">
    <div class="hero-main">
      <div class="kicker" data-i18n="kicker"></div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="lead"></p>
      <div class="hero-cta">
        <a href="#membership" class="btn btn-ink" data-i18n="cta_join"></a>
        <a href="#mission" class="btn btn-line" data-i18n="cta_mission"></a>
      </div>
    </div>
    <aside class="hero-side">
      <div class="desk-note">
        <div class="side-label" data-i18n="side1_label"></div>
        <h3 data-i18n="side1_text"></h3>
        <a href="#membership" data-i18n="side1_link"></a>
      </div>
      <div class="crisis-note">
        <div class="side-label" data-i18n="side2_label"></div>
        <h3 data-i18n="side2_text"></h3>
      </div>
      <div class="quote"><p data-i18n="side_quote"></p></div>
    </aside>
  </section>

  <div class="band">
    <div class="ph" data-label="PHOTO"></div>
    <div class="band-cap">
      <span class="pl-num">PL. 01</span>
      <span class="pl-cap" data-i18n="band_cap"></span>
    </div>
  </div>

  <section class="need" id="membership">
    <div class="need-head">
      <h2 data-i18n="need_title"></h2>
      <span class="mono" data-i18n="need_sub"></span>
    </div>
    <div class="need-grid">

function closeMenu(){ document.querySelector('.m-menu').classList.remove('open'); }

function setLang(lang){
  if(!I18N[lang]) lang='ru';
  const dict=I18N[lang];
  const html=document.documentElement;
  html.lang=lang;
  html.dir=(lang==='he')?'rtl':'ltr';
  html.className='disp-'+lang;
  document.title=dict.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(dict[k]!==undefined) el.innerHTML=dict[k];
  });
  document.querySelectorAll('[data-i18n-content]').forEach(el=>{
    const k=el.getAttribute('data-i18n-content');
    if(dict[k]!==undefined) el.setAttribute('content',dict[k]);
  });
  document.querySelectorAll('.lang a').forEach(a=>{
    a.classList.toggle('on', a.getAttribute('data-lang')===lang);
  });
  try{ localStorage.setItem('iia-lang',lang); }catch(e){}
}

document.querySelectorAll('.lang a').forEach(a=>{
  a.addEventListener('click',()=>setLang(a.getAttribute('data-lang')));
});

(function(){
  let lang='ru';
  try{ const s=localStorage.getItem('iia-lang'); if(s) lang=s; }catch(e){}
  setLang(lang);
})();
</script>
